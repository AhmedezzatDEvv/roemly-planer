<main class="section login-section py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="bg-white p-4 p-md-5 rounded-4 border shadow-sm">
          <div class="text-center mb-4">
            <div class="login-brand-icon d-inline-flex align-items-center justify-content-center rounded-3 mb-3">
              ✈️
            </div>
            <h1 class="fs-3 fw-bold text-dark mb-1">Welcome Back</h1>
            <p class="text-muted small">Sign in to manage your itineraries & explore destinations.</p>
          </div>

          <!-- Quick Demo Access Credentials Box -->
          <div class="p-3 bg-light rounded-3 border mb-4">
            <strong class="d-block small text-dark mb-2">⚡ Quick Demo Sign-In:</strong>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-sm btn-outline-primary flex-fill" (click)="fillAdminDemo()">
                🔑 Admin Account
              </button>
              <button type="button" class="btn btn-sm btn-outline-secondary flex-fill" (click)="fillTravelerDemo()">
                🎒 Traveler Account
              </button>
            </div>
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <!-- Email -->
            <div class="mb-3">
              <label for="login-email" class="form-label fw-semibold">Email Address</label>
              <input
                type="email"
                id="login-email"
                class="form-control"
                [class.is-invalid]="isFieldInvalid('email')"
                formControlName="email"
                placeholder="e.g. traveler@roamly.com" />
              @if (isFieldInvalid('email')) {
                <div class="invalid-feedback">Please enter a valid email address.</div>
              }
            </div>

            <!-- Password -->
            <div class="mb-4">
              <label for="login-password" class="form-label fw-semibold">Password</label>
              <input
                type="password"
                id="login-password"
                class="form-control"
                [class.is-invalid]="isFieldInvalid('password')"
                formControlName="password"
                placeholder="••••••••" />
              @if (isFieldInvalid('password')) {
                <div class="invalid-feedback">Password must be at least 6 characters.</div>
              }
            </div>

            <!-- Submit Button -->
            <button
              type="submit"
              class="btn btn-roamly-primary w-100 py-3 mb-3"
              [disabled]="isSubmitting()">
              @if (isSubmitting()) {
                <span>Signing in... ⏳</span>
              } @else {
                <span>Sign In ➔</span>
              }
            </button>

            <div class="text-center">
              <small class="text-muted">
                Don't have an account yet?
                <a routerLink="/register" class="text-primary fw-bold text-decoration-none">Register now</a>
              </small>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
